name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        回報前請先確認 pairing 檔、LocalDevVPN 與開發者模式都已就緒。不要貼上 pairing 檔內容。
  - type: textarea
    id: description
    attributes:
      label: 發生了什麼
      placeholder: 描述實際看到的行為...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 重現步驟
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 預期行為
    validations:
      required: true
  - type: input
    id: ios-version
    attributes:
      label: iOS 版本
      placeholder: 例如 18.3.1
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 裝置
      placeholder: 例如 iPhone 15 Pro
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: PikGo 版本
      placeholder: 例如 1.0.0
    validations:
      required: true
