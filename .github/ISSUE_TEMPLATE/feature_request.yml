name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        這個專案專注在位置模擬與健康步數。請說明你想解決的問題。
  - type: textarea
    id: description
    attributes:
      label: 想要的功能
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: 使用情境
      description: 為什麼需要？現在少了什麼？
    validations:
      required: true
